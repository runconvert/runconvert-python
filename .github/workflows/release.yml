# Publishes to PyPI when a version tag is pushed:
#   1. bump "version" in pyproject.toml and CHANGELOG.md, merge to main
#   2. gh release create v0.2.0 --target main   (or: git tag v0.2.0 && git push origin v0.2.0)
#   3. approve the "release" environment in the Actions tab
# Uses PyPI trusted publishing (OIDC): no PyPI token is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]
  # Started by release-please (release-please.yml) on the new tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python -m unittest tests.test_unit -v
      - name: The tag matches pyproject.toml
        run: test "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
